name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version and Deploy Check
        id: check
        run: |
          git fetch origin master
          git checkout origin/master -- package.json
          master_version=$(node -p "require('./package.json').version")
          git checkout -- package.json
          
          IFS='.' read -r major minor patch <<< "$master_version"
          
          echo "Current master version: $master_version"
          
          if [[ "${{ github.event.head_commit.message }}" == *"[100]"* ]]; then
            new_version="$((major + 1)).0.0"
            echo "SHOULD_DEPLOY=true" >> $GITHUB_ENV
            echo "UPDATE_VERSION=true" >> $GITHUB_ENV
          elif [[ "${{ github.event.head_commit.message }}" == *"[010]"* ]]; then
            new_version="$major.$((minor + 1)).0"
            echo "SHOULD_DEPLOY=true" >> $GITHUB_ENV
            echo "UPDATE_VERSION=true" >> $GITHUB_ENV
          elif [[ "${{ github.event.head_commit.message }}" == *"[001]"* ]]; then
            new_version="$major.$minor.$((patch + 1))"
            echo "SHOULD_DEPLOY=true" >> $GITHUB_ENV
            echo "UPDATE_VERSION=true" >> $GITHUB_ENV
          else
            new_version="$master_version"
            echo "SHOULD_DEPLOY=false" >> $GITHUB_ENV
            echo "UPDATE_VERSION=false" >> $GITHUB_ENV
          fi
          
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge dev into Master and Update Version
        if: env.SHOULD_DEPLOY == 'true'
        run: |
          git checkout master
          git merge --no-ff -X theirs dev -m "Merge dev into master for deployment"
          if [ "${{ env.UPDATE_VERSION }}" = "true" ]; then
            npm version ${{ env.NEW_VERSION }} --no-git-tag-version --allow-same-version
            git add package.json package-lock.json
            git commit -m "Update version to ${{ env.NEW_VERSION }}" || true
          fi
          git push origin master

      - name: Return to dev
        run: |
          git checkout dev

      - name: Install Dependencies
        if: env.SHOULD_DEPLOY == 'true'
        run: |
          git checkout master
          npm install

      - name: Set build time
        if: env.SHOULD_DEPLOY == 'true'
        run: |
          ampm=$(TZ='Asia/Seoul' date +%p)
          if [ "$ampm" = "AM" ]; then
            period="오전"
          else
            period="오후"
          fi
          echo "VITE_BUILD_TIME=$(TZ='Asia/Seoul' date +%Y년\ %m월\ %d일) $period $(TZ='Asia/Seoul' date +%I시)" >> $GITHUB_ENV

      - name: Build
        if: env.SHOULD_DEPLOY == 'true'
        env:
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}
        run: npm run build

      # Cloudflare Pages로 직접 업로드 배포
      - name: Deploy to Cloudflare Pages
        if: env.SHOULD_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=portfolio